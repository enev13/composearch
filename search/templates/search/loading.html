{% extends 'search/index.html' %}
{% block title %}
<title>Composearch - Searching for "{{ query }}"</title>
{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="py-12 text-center" id="search-results-container" data-query="{{ query }}">
        <div role="status" id="loading-indicator">
            <svg class="animate-spin mx-auto h-12 w-12 text-teal-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-6 text-xl text-gray-500">Searching for "{{ query }}"...</p>
        </div>
        <noscript>
            <p class="mt-6 text-xl text-gray-500">JavaScript is disabled.</p>
            <a class="text-l font-medium text-teal-600 hover:text-teal-900" href="/search/results/?query={{ query|urlencode }}">View results</a>
        </noscript>
    </div>
</div>
<script>
    (function () {
        var container = document.getElementById("search-results-container");
        var query = container.getAttribute("data-query");
        var url = "/search/results/?" + new URLSearchParams({ query: query, fragment: 1 });
                fetch(url)
                    .then(function (response) { return response.text(); })
            .then(function (html) {
                container.innerHTML = html;
                document.title = 'Composearch - Search results for "' + query + '"';
            })
            .catch(function () {
                container.innerHTML = '<p class="mt-6 text-xl text-gray-500">Something went wrong. Please try again.</p>';
            });
    })();
</script>
{% endblock %}
