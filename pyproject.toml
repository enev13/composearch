[tool.poetry]
name = "composearch"
version = "0.1.0"
description = "Composearch is a price comparison web app that combines the functionalities of a web scraper and a meta search engine"
authors = ["Petar Enev <enev@engineer.bg>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2"
beautifulsoup4 = "^4.15.0"
asgiref = "^3.13.0"
python-decouple = "^3.8"
playwright = "^1.64.0"
psycopg = {extras = ["binary", "pool"], version = "^3.3.0"}
redis = "^8.1.0"
gunicorn = "^26.0.0"
whitenoise = "^6.12.0"
uvicorn = "^0.54.0"
tzdata = "^2026.1"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
mypy = "^1.11.0"
black = "^24.0.0"
pytest = "^8.0.0"
pytest-django = "^4.11.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
